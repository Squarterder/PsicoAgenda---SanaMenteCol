<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block titulo %}PsicoAgenda{% endblock %} — SanaMenteCol</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'estilos.css' %}">
  {% block estilos_extra %}{% endblock %}
  <!-- csrf disponible para fetch() en aplicacion.js -->
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<!-- body_class: pagina-publica en login/registro, vacío en paneles -->
<body class="{% block body_class %}{% endblock %}">
  {% block contenido %}{% endblock %}

  <!-- mensajes de sistema (toast) -->
  {% if messages %}
  <div class="mensajes-sistema">
    {% for mensaje in messages %}
    <div class="alerta-sistema {{ mensaje.tags }}">{{ mensaje }}</div>
    {% endfor %}
  </div>
  <script>
    setTimeout(() => {
      const contenedor = document.querySelector('.mensajes-sistema');
      if (contenedor) contenedor.style.display = 'none';
    }, 5000);
  </script>
  {% endif %}

  <!-- aplicacion.js cargado globalmente; usa guards internos por página -->
  {% load static %}
  <script src="{% static 'aplicacion.js' %}"></script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
